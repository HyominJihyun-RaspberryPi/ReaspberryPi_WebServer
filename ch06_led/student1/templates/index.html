<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart LED Control</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, sans-serif;

        background: linear-gradient(135deg, #f8fafc, #e0f2fe);
    }

    .container-box {
        width: 440px;
        padding: 45px 40px;

        text-align: center;

        background: white;
        border-radius: 30px;

        box-shadow:
            0 20px 60px rgba(15, 23, 42, 0.12);

        border: 1px solid #e2e8f0;
    }

    .icon {
        font-size: 42px;
        margin-bottom: 8px;
    }

    h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 700;
        color: #0f172a;
    }

    .subtitle {
        margin-top: 8px;
        margin-bottom: 35px;
        color: #64748b;
    }

    .led-area {
        width: 220px;
        height: 220px;

        margin: 0 auto 25px;

        display: flex;
        justify-content: center;
        align-items: center;

        border-radius: 50%;

        background: #f8fafc;
        border: 1px solid #e2e8f0;

        transition: 0.4s;
    }

    .led-area.on {
        background: #fff7ed;

        box-shadow:
            0 0 35px rgba(249, 115, 22, 0.2);
    }

    #led {
        width: 120px;
        height: 120px;
        object-fit: contain;
    }

    .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;

        padding: 8px 18px;
        margin-bottom: 28px;

        border-radius: 30px;

        background: #f1f5f9;
        color: #64748b;

        font-size: 14px;
        font-weight: 500;
    }

    .status-dot {
        width: 9px;
        height: 9px;

        background: #94a3b8;
        border-radius: 50%;
    }

    .status.on .status-dot {
        background: #f97316;
        box-shadow: 0 0 10px rgba(249, 115, 22, 0.6);
    }

    .status.on {
        color: #ea580c;
        background: #fff7ed;
    }

    .buttons {
        display: flex;
        gap: 15px;
    }

    .control-btn {
        flex: 1;

        height: 58px;

        border: none;
        border-radius: 15px;

        font-size: 17px;
        font-weight: bold;

        cursor: pointer;

        transition: 0.25s;
    }

    .on-btn {
        background: #f1f5f9;
        color: #94a3b8;
    }

    .off-btn {
        background: #f1f5f9;
        color: #94a3b8;
    }

    .on-btn.active {
        background: linear-gradient(135deg, #fb923c, #f97316);
        color: white;

        box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3);
    }

    .off-btn.active {
        background: linear-gradient(135deg, #60a5fa, #2563eb);
        color: white;

        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
    }

    .control-btn:hover {
        transform: translateY(-3px);
    }

    .control-btn:active {
        transform: scale(0.96);
    }

    .footer {
        margin-top: 28px;

        color: #94a3b8;
        font-size: 12px;
    }
</style>


</head>

<body>


<div class="container-box">

    <div class="icon">💡</div>

    <h1>Smart LED</h1>

    <div class="subtitle">
        IoT LED Control System
    </div>

    <div id="ledArea" class="led-area">

        <img
            id="led"
            src="/static/off.png"
            alt="LED"
        >

    </div>

    <div id="status" class="status">
        <span class="status-dot"></span>
        LED OFF
    </div>

    <div class="buttons">

        <input
            class="control-btn on-btn"
            id="on"
            type="button"
            value="⚡ ON"
        >

        <input
            class="control-btn off-btn active"
            id="off"
            type="button"
            value="○ OFF"
        >

    </div>

    <div class="footer">
        Raspberry Pi • Smart Device Control
    </div>

</div>

<script src="/static/index.js"></script>


</body>
</html>
